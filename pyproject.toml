[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RC-OPLNet"
version = "0.1.0"
description = "RC-OPLNet: risk-calibrated ordinal prototype learning for cross-domain diabetic retinopathy grading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.2",
  "numpy>=1.23",
  "Pillow>=9",
  "scikit-learn>=1.3",
  "scipy>=1.9",
  "tensorboard>=2.12",
  "tqdm>=4.65",
  "yacs>=0.1.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "tomli>=2; python_version < '3.11'"]

[tool.setuptools]
py-modules = ["algorithms", "main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
  "configs*",
  "dataset*",
  "modeling*",
  "tools*",
  "utils*",
]
exclude = [
  "benchmarks*",
  "tests*",
  "data",
  "data.*",
  "result",
  "result.*",
  "tmp",
  "tmp.*",
]
namespaces = true

[tool.setuptools.package-data]
configs = ["available_domains.json", "datasets/*.yaml"]
